name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Scopes the deployment API needs. id-token mints the OIDC token that
# deploy-pages presents to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One production deploy at a time. A Pages deploy cancelled mid-upload can
# leave the site half-applied, so queue rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The site is plain HTML/CSS/JS with no build step, so the repo root is
      # the site root. path is required — the action defaults to _site/.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
